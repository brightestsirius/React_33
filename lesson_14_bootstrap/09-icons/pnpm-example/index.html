<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Icons через pnpm</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Встановлено: pnpm add bootstrap-icons -->
    <link
      rel="stylesheet"
      href="./node_modules/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="../../styles/style.css" />
  </head>
  <body class="page-icons">
    <div class="container">
      <h1>Bootstrap Icons, встановлені через pnpm</h1>
      <p>
        Іконки та шрифтові файли беруться з
        <code>node_modules/bootstrap-icons</code>, а не з CDN.
      </p>
      <p>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-heart-fill"></i>
        <i class="bi bi-check-circle-fill"></i>
      </p>
    </div>
  </body>
</html>
